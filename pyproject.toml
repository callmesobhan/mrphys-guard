[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[project]
name = "mrphys-guard"
version = "0.3.0"
description = "3D MRI Geometric Distortion, Synthetic-CT Physics Audit, ERE, Formal IEC 60601-2-33 Implant CSP & MR-Only Ambiguity-to-DVH / Anisotropic Margin Certifier"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [
  { name = "Sobhan Shahbazi" },
  { name = "mrphys-guard Contributors" },
]
keywords = [
  "medical-physics",
  "mri-distortion",
  "mr-linac",
  "synthetic-ct",
  "electron-return-effect",
  "iec-60601-2-33",
  "astm-f2503",
  "aapm-tg284",
  "dvh",
  "ptv-margin",
  "mcp",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "License :: Other/Proprietary License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Medical Science Apps.",
  "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
  "numpy>=1.26.0",
  "scipy>=1.12.0",
  "pydantic>=2.7.0",
  "pydicom>=2.4.4",
  "nibabel>=5.2.0",
  "pynrrd>=1.0.0",
  "matplotlib>=3.8.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2.0",
  "pytest-cov>=5.0.0",
  "ruff>=0.5.0",
]

[project.scripts]
mrphys-guard = "mrphys_guard.cli:main"
mrphys-guard-mcp = "mrphys_guard.harness.mcp_server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/mrphys_guard"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --strict-markers -W error"
filterwarnings = [
  "error",
]

[tool.coverage.run]
source = ["src/mrphys_guard"]
branch = false

[tool.coverage.report]
show_missing = true
precision = 1
